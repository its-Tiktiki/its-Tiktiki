<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241b3f"/>
      <stop offset="45%" stop-color="#5a4fb8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <style>
      @keyframes floatUpDown {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      #title-group {
        animation: floatUpDown 3.2s ease-in-out infinite;
        transform-origin: center;
      }
      #subtitle-group {
        animation: floatUpDown 3.2s ease-in-out infinite;
        animation-delay: 0.35s;
        transform-origin: center;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="#0e0e1a"/>

  <path d="M 0 0 L 900 0 L 900 190 Q 450 230 0 190 Z" fill="url(#bannerGradient)"/>

  <g id="title-group">
    <text x="450" y="105" text-anchor="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="800" font-size="52" fill="#ffffff"
          letter-spacing="2">TIKTIKI</text>
  </g>

  <g id="subtitle-group">
    <text x="450" y="145" text-anchor="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="600" font-size="17" fill="#f1edff"
          letter-spacing="1">Student · Aspiring Data Scientist · Builder</text>
  </g>
</svg>
