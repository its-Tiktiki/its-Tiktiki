<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241b3f"/>
      <stop offset="45%" stop-color="#5a4fb8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="#0e0e1a"/>

  <path d="M 0 0 L 900 0 L 900 190 Q 450 230 0 190 Z" fill="url(#bannerGradient)"/>

  <g id="title-group" filter="url(#textShadow)">
    <text x="450" y="105" text-anchor="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="800" font-size="52" fill="#ffffff"
          letter-spacing="2">TIKTIKI
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -10; 0 0" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <g id="subtitle-group" filter="url(#textShadow)">
    <text x="450" y="145" text-anchor="middle"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="600" font-size="17" fill="#f1edff"
          letter-spacing="1">Student · Aspiring Data Scientist · Builder
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -10; 0 0" dur="3.2s" begin="0.35s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
